<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
		<title>Recall Audio Recorder</title>
		<style>
			body {
				font: 13px -apple-system, system-ui, sans-serif;
				margin: 0;
				padding: 20px;
				color: #1a1a1a;
				background: #fafafa;
			}
			h1 { font-size: 15px; margin: 0 0 16px; }
			.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
			.pill {
				padding: 2px 8px;
				border-radius: 10px;
				background: #e5e5e5;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.4px;
			}
			.pill.granted { background: #d3f0d8; }
			.pill.denied { background: #f5d3d3; }
			label { width: 110px; }
			button { font: inherit; padding: 4px 10px; }
			#record { padding: 8px 18px; font-size: 14px; margin: 16px 0; }
			#error { color: #a11; min-height: 16px; }
			#log {
				font: 11px ui-monospace, Menlo, monospace;
				background: #fff;
				border: 1px solid #ddd;
				height: 280px;
				overflow-y: auto;
				padding: 8px;
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<h1>Audio-only in-person recorder</h1>

		<div class="row">
			<label>Microphone</label>
			<span class="pill" id="perm-microphone">unknown</span>
			<button data-permission="microphone">Request</button>
		</div>
		<div class="row">
			<label>System audio</label>
			<span class="pill" id="perm-system-audio">unknown</span>
			<button data-permission="system-audio">Request</button>
		</div>

		<button id="record">Start recording</button>
		<div class="row"><label>State</label><span id="state">idle</span></div>
		<div class="row"><label>Upload</label><span id="upload">—</span></div>
		<div id="error"></div>

		<div id="log"></div>
		<script src="renderer.js"></script>
	</body>
</html>
